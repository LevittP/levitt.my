<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Levitt Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="particles"></canvas>

<div class="dashboard">

    <h1>Levitt</h1>

    <div id="date"></div>
    <div id="clock"></div>

    <input 
    id="search"
    placeholder="Search the web..."
    >

    <div id="widgets" class="grid">

        <div class="card">
            <h2>Links</h2>

            <a href="https://youtube.com">
            YouTube
            </a>

            <a href="https://github.com">
            GitHub
            </a>

            <a href="https://discord.com">
            Discord
            </a>

            <a href="https://roblox.com">
            Roblox
            </a>
        </div>


        <div class="card">
            <h2>🌦 Weather</h2>
            <p id="weather">
            Loading...
            </p>
        </div>


        <div class="card">
            <h2>PC</h2>

            <p>
            Browser: Edge
            </p>

            <p>
            Status: Online
            </p>

        </div>


        <div class="card">
            <h2>Minecraft</h2>

            <p id="minecraft">
            Not configured
            </p>

        </div>


        <div class="card">
            <h2>Spotify</h2>

            <p id="spotify">
            Not connected
            </p>

        </div>


        <div class="card">

            <h2>Settings</h2>

            <button onclick="openSettings()">
            Open Settings
            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<script src="particles.js"></script>
<script src="minecraft.js"></script>
<script src="spotify.js"></script>
<script src="script.js"></script>

</body>
</html>
